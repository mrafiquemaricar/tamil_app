    <style>
        body {

            padding: 0;

            background: white;
            color: black;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            height: 100vh;
            user-select: none;
        }

        .home {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }

        #home {
            text-decoration: none;
            background-color: #0000ff;
            color: #ffffff;
            padding: 10px;
            border-radius: 15px;
        }

        #game-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: radial-gradient(circle at center, #0a1128 0%, #000411 100%);
            border-left: 2px solid #1e293b;
            border-right: 2px solid #1e293b;
        }

        /* Top HUD Bar */
        #hud {
            display: flex;
            justify-content: space-between;
            padding: 12px 20px;
            background: rgba(15, 23, 42, 0.8);
            border-bottom: 1px solid #334155;
            font-size: 1.1rem;
            font-weight: bold;
            z-index: 10;
        }

        #lives {
            color: #ef4444;
        }

        #score {
            color: #10b981;
        }

        /* Canvas Game Field */
        canvas {
            flex-grow: 1;
            width: 100%;
            display: block;
        }

        /* Bottom Laser Controls Area */
        #controls-panel {
            background: rgba(15, 23, 42, 0.9);
            border-top: 2px solid #334155;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 10;
        }

        #instruction {
            text-align: center;
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 5px;
        }

        #laser-buttons {
            display: flex;
            justify-content: space-around;
            gap: 10px;
        }

        .laser-btn {
            flex: 1;
            padding: 15px 5px;
            font-size: 1rem;
            font-weight: bold;
            color: white;
            background: linear-gradient(135deg, #1e40af 0%, #1d4ed8 100%);
            border: 2px solid #3b82f6;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
            transition: transform 0.1s, filter 0.1s;
            text-align: center;
        }

        .laser-btn:active {
            transform: scale(0.95);
            filter: brightness(1.2);
        }

        /* Screens overlays */
        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(5, 5, 15, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 20px;
            text-align: center;
        }

        .overlay h2 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            color: #3b82f6;
        }

        .overlay p {
            font-size: 1.1rem;
            color: #94a3b8;
            margin-bottom: 25px;
            max-width: 80%;
        }

        .start-btn {
            padding: 15px 40px;
            font-size: 1.4rem;
            font-weight: bold;
            color: white;
            background: #10b981;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.5);
            margin-bottom: 15px;

            display: flex;
            gap: 15px;
            margin-top: 10px;

        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const laserBtns = document.querySelectorAll(".laser-btn");

        let score = 0;
        let lives = 3;
        let gameRunning = false;
        let asteroids = [];
        let lasers = [];
        let particles = [];
        let currentAsteroid = null;
        let spawnTimer = 0;
        
        // Speed settings configs
        let selectedSpeedSetting = 'medium';
        let spawnInterval = 120; 
        let baseSpeed = 1.2;

        // Function called via speed picker buttons
        function setSpeed(speedMode, buttonEl) {
            selectedSpeedSetting = speedMode;
            
            // Toggle active visual class
            document.querySelectorAll('.speed-btn').forEach(btn => btn.classList.remove('active'));
            buttonEl.classList.add('active');
        }

        // Helper function to dynamically wrap text lines inside asteroid bounds
        function fillWrappedText(ctx, text, x, y, maxWidth, lineHeight) {
            const words = text.split(' ');
            let lines = [];
            let currentLine = words[0];

            for (let i = 1; i < words.length; i++) {
                let word = words[i];
                let width = ctx.measureText(currentLine + " " + word).width;
                if (width < maxWidth) {
                    currentLine += " " + word;
                } else {
                    lines.push(currentLine);
                    currentLine = word;
                }
            }
            lines.push(currentLine);

            let totalHeight = lines.length * lineHeight;
            let startY = y - (totalHeight / 2) + (lineHeight / 2);

            for (let j = 0; j < lines.length; j++) {
                ctx.fillText(lines[j], x, startY + (j * lineHeight));
            }
        }

        // Resize Canvas dynamically
        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight - document.getElementById("hud").clientHeight - document.getElementById("controls-panel").clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);

        function showStartScreen() {
            document.getElementById("gameover-screen").style.display = "none";
            document.getElementById("start-screen").style.display = "flex";
            laserBtns.forEach(btn => btn.textContent = "-");
        }

        // Start / Reset Game Configuration
        function startGame() {
            document.getElementById("start-screen").style.display = "none";
            document.getElementById("gameover-screen").style.display = "none";
            resizeCanvas();

            score = 0;
            lives = 3;
            asteroids = [];
            lasers = [];
            particles = [];
            spawnTimer = 0;

            // Apply selected choices configuration
            if (selectedSpeedSetting === 'slow') {
                baseSpeed = 0.7;
                spawnInterval = 160;
            } else if (selectedSpeedSetting === 'fast') {
                baseSpeed = 2.0;
                spawnInterval = 80;
            } else { // medium
                baseSpeed = 1.2;
                spawnInterval = 120;
            }

            updateHUD();
            spawnAsteroid();
            gameRunning = true;
            animate();
        }

        function updateHUD() {
            document.getElementById("score").textContent = "மதிப்பெண்: " + score;
            document.getElementById("lives").textContent = "உயிர்கள்: " + lives;
        }

        // Generate a new asteroid
        function spawnAsteroid() {
            if (wordList.length === 0) return;

            const targetWord = wordList[Math.floor(Math.random() * wordList.length)];

            let options = [targetWord.tamil];
            while (options.length < 3) {
                let randTamil = wordList[Math.floor(Math.random() * wordList.length)].tamil;
                if (!options.includes(randTamil)) {
                    options.push(randTamil);
                }
            }
            options.sort(() => Math.random() - 0.5);

            const size = 50;
            const x = Math.random() * (canvas.width - size * 2) + size;

            const asteroid = {
                x: x,
                y: -40,
                radius: size,
                data: targetWord,
                options: options,
                speed: baseSpeed + (score * 0.04) // Scaled slightly on score gains
            };

            asteroids.push(asteroid);
            updateControlButtons();
        }

        function updateControlButtons() {
            let target = asteroids[0];
            if (target) {
                currentAsteroid = target;
                for (let i = 0; i < 3; i++) {
                    laserBtns[i].textContent = target.options[i];
                }
            } else {
                currentAsteroid = null;
                laserBtns.forEach(btn => btn.textContent = "-");
            }
        }

        // Trigger laser beams
        function fireLaser(buttonIndex) {
            if (!gameRunning || !currentAsteroid) return;

            const selectedTamil = currentAsteroid.options[buttonIndex];
            const startX = canvas.width / 2;
            const startY = canvas.height - 30;

            lasers.push({
                x: startX,
                y: startY,
                targetX: currentAsteroid.x,
                targetY: currentAsteroid.y,
                progress: 0,
                isCorrect: (selectedTamil === currentAsteroid.data.tamil),
                targetAsteroid: currentAsteroid
            });

            if (selectedTamil === currentAsteroid.data.tamil) {
                score += 10;
                // Scale difficulty up slightly by dropping spawn intervals depending on choices
                let baseInterval = selectedSpeedSetting === 'slow' ? 160 : (selectedSpeedSetting === 'fast' ? 80 : 120);
                spawnInterval = Math.max(selectedSpeedSetting === 'fast' ? 45 : 60, baseInterval - Math.floor(score / 5));
                
                createExplosion(currentAsteroid.x, currentAsteroid.y, "#10b981");
                asteroids.shift(); 
            } else {
                score = Math.max(0, score - 5);
                createExplosion(startX, startY - 50, "#ef4444");
            }

            updateHUD();
            updateControlButtons();
        }

        // Particle System for Explosions
        function createExplosion(x, y, color) {
            for (let i = 0; i < 15; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    radius: Math.random() * 3 + 1,
                    alpha: 1,
                    color: color
                });
            }
        }

        // Main Loop Engine
        function animate() {
            if (!gameRunning) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Background Starfield Effect
            ctx.fillStyle = "rgba(255,255,255,0.05)";
            for (let i = 0; i < 10; i++) {
                ctx.fillRect((Math.sin(i + spawnTimer * 0.01) + 1) * canvas.width / 2, (i * 60 + spawnTimer) % canvas.height, 2, 2);
            }

            // Draw Safety / Danger Boundary Line
            ctx.strokeStyle = "rgba(239, 68, 68, 0.4)";
            ctx.lineWidth = 2;
            ctx.setLineDash([6, 6]);
            ctx.beginPath();
            ctx.moveTo(0, canvas.height - 50);
            ctx.lineTo(canvas.width, canvas.height - 50);
            ctx.stroke();
            ctx.setLineDash([]);

            // Draw Spaceship
            ctx.fillStyle = "#3b82f6";
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, canvas.height - 45);
            ctx.lineTo(canvas.width / 2 - 20, canvas.height - 15);
            ctx.lineTo(canvas.width / 2 + 20, canvas.height - 15);
            ctx.closePath();
            ctx.fill();

            // Update & Render Asteroids
            for (let i = asteroids.length - 1; i >= 0; i--) {
                let ast = asteroids[i];
                ast.y += ast.speed;

                // Draw Asteroid
                ctx.fillStyle = "#334155";
                ctx.strokeStyle = "#475569";
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(ast.x, ast.y, 35, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                // Text Formatting & Custom Wrapping
                ctx.fillStyle = "#ffffff";
                ctx.font = "Bold 13px Arial";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                
                fillWrappedText(ctx, ast.data.english, ast.x, ast.y, 52, 14);

                // Check Boundary Impact
                if (ast.y >= canvas.height - 50) {
                    lives--;
                    createExplosion(ast.x, ast.y, "#ef4444");
                    asteroids.splice(i, 1);
                    updateHUD();
                    updateControlButtons();

                    if (lives <= 0) {
                        endGame();
                        return;
                    }
                }
            }

            // Update & Draw Laser Projectiles
            for (let i = lasers.length - 1; i >= 0; i--) {
                let laser = lasers[i];
                laser.progress += 0.15;

                let currentX = laser.x + (laser.targetX - laser.x) * laser.progress;
                let currentY = laser.y + (laser.targetY - laser.y) * laser.progress;

                ctx.strokeStyle = laser.isCorrect ? "#10b981" : "#ef4444";
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(laser.x, laser.y);
                ctx.lineTo(currentX, currentY);
                ctx.stroke();

                if (laser.progress >= 1) {
                    lasers.splice(i, 1);
                }
            }

            // Render active particles
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.02;

                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                } else {
                    ctx.save();
                    ctx.globalAlpha = p.alpha;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            }

            // Game timing logic
            spawnTimer++;
            if (spawnTimer >= spawnInterval) {
                spawnAsteroid();
                spawnTimer = 0;
            }

            requestAnimationFrame(animate);
        }

        // Game Over Execution
        function endGame() {
            gameRunning = false;
            document.getElementById("final-score").textContent = "உங்களது மொத்த மதிப்பெண்: " + score;
            document.getElementById("gameover-screen").style.display = "flex";
        }
    </script>
</body>
