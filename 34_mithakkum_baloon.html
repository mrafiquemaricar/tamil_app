<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>மிதக்கும் பலூன்</title>
    <style>
        :root {
            --sky-top: #a1c4fd;
            --sky-bottom: #c2e9fb;
            --sea: #0077b6;
            --ui-bg: rgba(255, 255, 255, 0.95);
            --text-dark: #1d3557;
            --danger: #e63946;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* background: linear-gradient(to bottom, var(--sky-top), var(--sky-bottom)); */
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }



        .home {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }

        #home {
            text-decoration: none;
            background-color: #0000ff;
            color: #ffffff;
            padding: 10px;
            border-radius: 15px;
        }


        /* --- UI TOP PANEL --- */
        .header-panel {
            margin-top: 15px;
            z-index: 10;
            width: 90%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .target-box {
            background: var(--ui-bg);
            border: 3px solid var(--text-dark);
            border-radius: 12px;
            padding: 10px 30px;
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--text-dark);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .stats-box {
            background: var(--ui-bg);
            border-radius: 20px;
            padding: 8px 25px;
            display: flex;
            gap: 25px;
            font-weight: bold;
            color: var(--text-dark);
            font-size: 1.1rem;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }

        /* --- GAME STAGE --- */
        .game-stage {
            position: relative;
            flex-grow: 1;
            width: 100%;
            overflow: hidden;
        }

        .sea-floor {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 25vh;
            background: linear-gradient(to bottom, #0096c7, var(--sea));
            z-index: 1;
        }

        /* --- BALLOONS --- */
        .balloon {
            position: absolute;
            bottom: -150px;
            width: 110px;
            height: 130px;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
            box-shadow: inset -10px -10px 20px rgba(0, 0, 0, 0.15), 0 10px 20px rgba(0, 0, 0, 0.1);
            animation: floatUp linear forwards;
        }

        .balloon-text {
            color: white;
            font-size: 1rem;
            font-weight: bold;
            z-index: 10;
            position: relative;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.6), -1px -1px 3px rgba(0, 0, 0, 0.6);
            text-align: center;
            padding: 5px;
            width: 100%;

            /* --- CHANGES FOR TEXT WRAPPING --- */
            white-space: normal;
            /* Allows text to break onto a new line naturally */
            overflow-wrap: break-word;
            /* Forces long words to break if they exceed balloon width */
            word-break: break-word;
            /* Extra insurance for older browser compatibility */
            /* Remove text-overflow: ellipsis; if it was previously forcing dots */
        }

        .balloon::after {
            content: "";
            position: absolute;
            bottom: -8px;
            left: calc(50% - 7px);
            border-left: 7px solid transparent;
            border-right: 7px solid transparent;
            border-bottom: 10px solid currentColor;
            filter: brightness(0.85);
            z-index: 2;
        }

        .balloon-string {
            position: absolute;
            bottom: -35px;
            left: calc(50% - 1px);
            width: 2px;
            height: 30px;
            background: rgba(0, 0, 0, 0.2);
            z-index: 1;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg);
            }

            50% {
                transform: translateY(-50vh) rotate(3deg);
            }

            100% {
                transform: translateY(-120vh) rotate(-3deg);
            }
        }

        /* --- OVERLAYS --- */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(29, 53, 87, 0.9);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
        }

        .overlay h2 {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .overlay p {
            font-size: 1.5rem;
            margin-bottom: 25px;
        }

        .btn-start {
            background: #ffb703;
            color: #1d3557;
            border: none;
            padding: 15px 40px;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 183, 3, 0.4);
        }

        /* --- PARTICLES FOR POPPING EFFECT --- */
        .particle {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            z-index: 6;
            pointer-events: none;
            animation: explode 0.5s ease-out forwards;
        }

        @keyframes explode {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }

            100% {
                transform: translate(var(--x), var(--y)) scale(0);
                opacity: 0;
            }
        }

        h1 {
            color: blue
        }
    </style>
</head>

        const colors = ['#e63946', '#3a86ff', '#e07a5f', '#2ec4b6', '#9b5de5', '#ff007f'];

        let score = 0;
        let lives = 3;
        let gameActive = false;
        let currentTarget = null;
        let spawnTimer = null;
        let targetChangeTimer = null;
        let currentSpeed = 6;

        const stage = document.getElementById('stage');
        const targetWordDisplay = document.getElementById('target-word');
        const scoreDisplay = document.getElementById('score-val');
        const livesDisplay = document.getElementById('lives-val');
        const menuOverlay = document.getElementById('menu-overlay');

        function startGame() {
            score = 0;
            lives = 3;
            currentSpeed = 6;
            gameActive = true;
            scoreDisplay.innerText = score;
            updateLivesDisplay();
            menuOverlay.style.display = 'none';

            pickNewTarget();

            // Standard background loop to spawn random filler words
            spawnTimer = setInterval(() => {
                if (gameActive) spawnBalloon(null);
            }, 1400);

            // Turn on auto-rotate timer for prompts if user takes too long
            targetChangeTimer = setInterval(pickNewTarget, 9000);
        }

        function pickNewTarget() {
            if (!gameActive) return;

            // Select new target word
            const randomItem = wordList[Math.floor(Math.random() * wordList.length)];
            currentTarget = randomItem;
            targetWordDisplay.innerText = currentTarget.english;

            // GUARANTEE: Instantly spawn the correct matching balloon so it is visible inside 3 seconds
            spawnBalloon(currentTarget);
        }

        function updateLivesDisplay() {
            livesDisplay.innerText = lives;
        }

        // specificWordObj allows us to bypass random selection and force spawn the correct target
        function spawnBalloon(specificWordObj = null) {
            if (!gameActive) return;

            // Use the forced target data, or grab a random one if null
            const wordData = specificWordObj ? specificWordObj : wordList[Math.floor(Math.random() * wordList.length)];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];

            const balloon = document.createElement('div');
            balloon.className = 'balloon';
            balloon.style.backgroundColor = randomColor;
            balloon.style.color = randomColor;

            const textContainer = document.createElement('div');
            textContainer.className = 'balloon-text';
            textContainer.innerText = wordData.tamil;
            balloon.appendChild(textContainer);

            const randomX = Math.floor(Math.random() * (stage.offsetWidth - 120));
            balloon.style.left = `${randomX}px`;
            balloon.style.animationDuration = `${currentSpeed}s`;

            const stringEl = document.createElement('div');
            stringEl.className = 'balloon-string';
            balloon.appendChild(stringEl);

            balloon.addEventListener('mousedown', (e) => handlePop(balloon, wordData, e));
            balloon.addEventListener('touchstart', (e) => handlePop(balloon, wordData, e));

            balloon.addEventListener('animationend', () => {
                if (wordData.english === currentTarget.english && gameActive) {
                    loseLife();
                }
                balloon.remove();
            });

            stage.appendChild(balloon);
        }

        function handlePop(balloonEl, wordData, event) {
            if (!gameActive) return;
            event.preventDefault();

            createBurst(balloonEl.offsetLeft + 55, balloonEl.offsetTop + 65, balloonEl.style.backgroundColor);

            if (wordData.english === currentTarget.english) {
                score += 50;
                scoreDisplay.innerText = score;

                if (score % 200 === 0 && currentSpeed > 3.5) {
                    currentSpeed -= 0.5;
                }

                // Clear prompt rotation timer so player gets a fresh 9 seconds for the next word
                clearInterval(targetChangeTimer);
                targetChangeTimer = setInterval(pickNewTarget, 9000);

                pickNewTarget();
            } else {
                loseLife();
            }

            balloonEl.remove();
        }

        function createBurst(x, y, color) {
            for (let i = 0; i < 12; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.backgroundColor = color;
                p.style.left = `${x}px`;
                p.style.top = `${y}px`;

                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 80 + 40;
                p.style.setProperty('--x', `${Math.cos(angle) * distance}px`);
                p.style.setProperty('--y', `${Math.sin(angle) * distance}px`);

                stage.appendChild(p);
                setTimeout(() => p.remove(), 500);
            }
        }

        function loseLife() {
            lives--;
            updateLivesDisplay();
            if (lives <= 0) endGame();
        }

        function endGame() {
            gameActive = false;
            clearInterval(spawnTimer);
            clearInterval(targetChangeTimer);
            document.querySelectorAll('.balloon').forEach(b => b.remove());

            menuOverlay.querySelector('h2').innerText = "Game Over 🎈";
            menuOverlay.querySelector('p').innerText = `Final Score: ${score} points!`;
            menuOverlay.querySelector('.btn-start').innerText = "Try Again";
            menuOverlay.style.display = 'flex';
        }
