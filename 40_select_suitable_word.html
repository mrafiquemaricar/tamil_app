        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function resetPool() {
            remaining = shuffle([...phrases]);
        }

        // 🔹 split one phrase into its 4 "PRONOUN [object words] VERB." sentences,
        //    and for each sentence randomly blank exactly ONE single word:
        //    either the pronoun (அவன்/அவள்/அவர்/அவர்கள்) or the verb — never any object word in between.
        function buildSentences(phrase) {
            const sentences = phrase.trim().split(/(?<=\.)\s+/).filter(s => s.trim());
            return sentences.map(sentence => {
                const clean = sentence.trim();
                const punctuation = clean.endsWith('.') ? '.' : '';
                const body = punctuation ? clean.slice(0, -1) : clean;
                const words = body.trim().split(/\s+/);

                const pronounWord = words[0];                      // first word = pronoun
                const verbWord = words[words.length - 1];          // last word = verb
                const middleWords = words.slice(1, -1).join(' ');  // any object words in between (unblanked)

                const blankIsPronoun = Math.random() < 0.5;

                if (blankIsPronoun) {
                    return {
                        before: '',
                        blankWord: pronounWord,
                        after: (middleWords ? ' ' + middleWords : '') + ' ' + verbWord + punctuation
                    };
                } else {
                    return {
                        before: pronounWord + (middleWords ? ' ' + middleWords : '') + ' ',
                        blankWord: verbWord,
                        after: punctuation
                    };
                }
            });
        }

        function pickPhrase() {
            if (remaining.length === 0) {
                paragraphDiv.innerHTML = "<h2>🎉 அனைத்து தொடர்களும் முடிந்துவிட்டது!</h2>";
                wordChunksDiv.innerHTML = "";
                nextBtn.style.display = "none";
                return false;
            }
            const phrase = remaining.pop();
            currentPhraseSentences = buildSentences(phrase);
            return true;
        }

        function prepareAndRender() {
            if (!pickPhrase()) return;

            paragraphDiv.innerHTML = "";
            wordChunksDiv.innerHTML = "";
            selectedBlank = null;

            const allAnswers = [];

            currentPhraseSentences.forEach(({ before, blankWord, after }) => {
                allAnswers.push(blankWord);

                const qDiv = document.createElement('div');
                qDiv.className = 'question';

                if (before) qDiv.appendChild(document.createTextNode(before));

                const blank = document.createElement('span');
                blank.className = 'blank';

                // tap to select
                blank.addEventListener('click', () => {
                    document.querySelectorAll('.blank').forEach(b => b.classList.remove('selected'));
                    blank.classList.add('selected');
                    selectedBlank = blank;
                });

                // allow drop
                blank.addEventListener('dragover', e => e.preventDefault());
                blank.addEventListener('drop', e => {
                    e.preventDefault();
                    const word = e.dataTransfer.getData('text/plain');
                    if (!word) return;

                    // free old word
                    const prev = blank.textContent.trim();
                    if (prev) {
                        const prevChunk = document.querySelector(`.word-chunk[data-word="${prev}"]`);
                        if (prevChunk) prevChunk.classList.remove('used');
                    }

                    blank.textContent = word;
                    const chunk = document.querySelector(`.word-chunk[data-word="${word}"]`);
                    if (chunk) chunk.classList.add('used');
                });

                qDiv.appendChild(blank);

                if (after) qDiv.appendChild(document.createTextNode(after));

                paragraphDiv.appendChild(qDiv);
            });

            // render chunks — just the 4 correct answers for this phrase, shuffled
            shuffle(allAnswers).forEach(word => {
                const chunk = document.createElement('div');
                chunk.className = 'word-chunk';
                chunk.textContent = word;
                chunk.dataset.word = word;
                chunk.setAttribute('draggable', 'true');

                // drag
                chunk.addEventListener('dragstart', e => {
                    e.dataTransfer.setData('text/plain', word);
                });

                // tap to fill
                chunk.addEventListener('click', function () {
                    if (!selectedBlank || this.classList.contains('used')) return;

                    // free previous word
                    const prev = selectedBlank.textContent.trim();
                    if (prev) {
                        const prevChunk = document.querySelector(`.word-chunk[data-word="${prev}"]`);
                        if (prevChunk) prevChunk.classList.remove('used');
                    }

                    selectedBlank.textContent = this.dataset.word;
                    this.classList.add('used');

                    selectedBlank.classList.remove('selected');
                    selectedBlank = null;
                });

                wordChunksDiv.appendChild(chunk);
            });
        }

        function checkAnswers() {
            const blanks = document.querySelectorAll('.blank');
            currentPhraseSentences.forEach(({ blankWord }, i) => {
                const blank = blanks[i];
                if ((blank.textContent || "").trim() === blankWord) {
                    blank.classList.add('correct');
                    blank.classList.remove('incorrect');
                } else {
                    blank.classList.add('incorrect');
                    blank.classList.remove('correct');
                }
            });
        }

        document.getElementById('checkBtn').addEventListener('click', checkAnswers);
        nextBtn.addEventListener('click', prepareAndRender);

        // first round
        resetPool();
        prepareAndRender();
    </script>
</body>

</html>
