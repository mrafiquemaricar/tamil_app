<!DOCTYPE html>
<html lang="ta">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>சரியான வார்த்தையைப் பிடி </title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f9f9f9;
      margin: 0;
      padding: 20px;
      text-align: center;
      overflow: hidden;
    }

    h1 { color: #00f; }

    #categorySelect {
      width: 100%;
      max-width: 400px;
      padding: 10px;
      font-size: 1.1em;
      margin-bottom: 20px;
      text-align: center;
    }

    #home {
      text-decoration: none;
      background-color: #0000ff;
      color: #ffffff;
      padding: 10px;
      border-radius: 15px;
    }

    #gameArea {
      position: relative;
      width: 100%;
      height: 400px;
      border: 1px solid #ccc;
      margin: 20px auto;
      overflow: hidden;
      background: #e0f7fa;
    }

    .tamilWord {
      position: absolute;
      padding: 5px 10px;
      background: #ffeb3b;
      border-radius: 8px;
      cursor: pointer;
      user-select: none;
    }

    #wrongIndicator {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 3em;
      color: red;
      display: none;
      font-weight: bold;
    }

    #englishWord {
      font-size: 2em;
      font-weight: bold;
      margin-bottom: 5px;
    }

    #scoreboard {
      font-size: 1.2em;
      margin-top: 5px;
    }

    #timer {
      font-size: 1.5em;
      margin-top: 5px;
    }
  </style>
</head>

<body>

  <a id="home" href="index.html"> ◀ முகப்பு</a>
  <h1>சரியான வார்த்தையைப் பிடி</h1>

  <select id="categorySelect">
    <option value="">-- தேர்வு செய்யவும் --</option>
  </select>

  <div id="englishWord"></div>

  <div id="timer">நேரம்: 60</div>
  <div id="scoreboard">சரி: 0 | தவறு: 0 | மீதி: 0</div>

  <div id="gameArea"></div>
  <div id="wrongIndicator">தவறு!</div>

  <script>
    const sheetUrl = 'word_list.csv';

    let cards = [];
    let filteredCards = [];
    let currentIndex = 0;

    let gameWords = [];
    let englishWordsQueue = [];

    let timer = 60;
    let timerInterval;

    let scoreCorrect = 0;
    let scoreWrong = 0;

    function parseCSV(text) {
      const rows = [];
      let cur = [];
      let field = '';
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const ch = text[i];

        if (ch === '"') {
          if (inQuotes && text[i + 1] === '"') { field += '"'; i++; }
          else { inQuotes = !inQuotes; }
        }
        else if ((ch === ',' && !inQuotes) || ((ch === '\n' || ch === '\r') && !inQuotes)) {
          if (ch === '\r' && text[i + 1] === '\n') i++;

          cur.push(field);
          field = '';

          if (ch === '\n' || ch === '\r') {
            if (cur.some(c => c.trim() !== '')) rows.push(cur);
            cur = [];
          }
        }
        else { field += ch; }
      }

      if (field !== '' || cur.length > 0) {
        cur.push(field);
        if (cur.some(c => c.trim() !== '')) rows.push(cur);
      }

      return rows;
    }

    function loadCards() {
      fetch(sheetUrl)
        .then(res => res.text())
        .then(text => {

          const rawRows = parseCSV(text);
          const header = rawRows[0];

          const catIndex = header.indexOf('Category');
          const tamilIndex = header.indexOf('Tamil');
          const engIndex = header.indexOf('English');

          cards = rawRows.slice(1).map(r => ({
            Category: r[catIndex],
            Tamil: r[tamilIndex],
            English: r[engIndex]
          }));

          loadCategories();
        });
    }

    function loadCategories() {
      const select = document.getElementById('categorySelect');

      const categories = [...new Set(cards.map(c => c.Category))];

      select.innerHTML = '<option value="">-- தேர்வு செய்யவும் --</option>';
      select.innerHTML += categories.map(c => `<option>${c}</option>`).join("");

      select.onchange = function () {
        scoreCorrect = 0;
        scoreWrong = 0;
        updateScoreboard();
        startGameForCategory(this.value);
      };
    }

    function startGameForCategory(category) {

      filteredCards = cards.filter(c => c.Category === category);

      const gameArea = document.getElementById('gameArea');
      gameArea.innerHTML = '';

      gameWords = filteredCards.map(c => ({ Tamil: c.Tamil, English: c.English }));
      englishWordsQueue = [...gameWords];

      document.getElementById("scoreboard").textContent =
        "சரி: 0 | தவறு: 0 | மீதி: " + englishWordsQueue.length;

      showNextEnglishWord();

      gameWords.forEach(word => {

        const div = document.createElement('div');

        div.className = 'tamilWord';
        div.textContent = word.Tamil;
        div.dataset.english = word.English;

        gameArea.appendChild(div);

        randomMove(div);

        div.addEventListener('click', () => handleWordClick(div));
      });

      timer = 60;

      const timerDiv = document.getElementById('timer');

      clearInterval(timerInterval);

      timerInterval = setInterval(() => {

        timer--;

        timerDiv.textContent = "நேரம்: " + timer;

        if (timer <= 0) {
          clearInterval(timerInterval);
          alert("⏰ நேரம் முடிந்தது!");
        }

      }, 1000);
    }

    function showNextEnglishWord() {

      if (englishWordsQueue.length === 0) return;

      const idx = Math.floor(Math.random() * englishWordsQueue.length);

      document.getElementById('englishWord').textContent =
        englishWordsQueue[idx].English;

      currentIndex = idx;
    }

    function handleWordClick(div) {

      const currentEnglish = englishWordsQueue[currentIndex].English;

      if (div.dataset.english === currentEnglish) {

        // 🔊 PRONUNCIATION FIRST
        const utter = new SpeechSynthesisUtterance(div.textContent);
        utter.lang = "ta-IN";
        speechSynthesis.speak(utter);

        div.style.display = 'none';

        englishWordsQueue.splice(currentIndex, 1);

        scoreCorrect++;

        updateScoreboard();

        // ⭐ LAST WORD FIX
        if (englishWordsQueue.length === 0) {

          setTimeout(() => {
            clearInterval(timerInterval);
            alert("🎉 முடிந்தது!\nசரி: " + scoreCorrect + "\nதவறு: " + scoreWrong);
          }, 800);

          return;
        }

        showNextEnglishWord();

      } else {

        scoreWrong++;

        updateScoreboard();

        flashWrongIndicator();
      }
    }

    function flashWrongIndicator() {
      const ind = document.getElementById('wrongIndicator');
      ind.style.display = 'block';

      setTimeout(() => {
        ind.style.display = 'none';
      }, 500);
    }

    function randomMove(div) {

      const gameArea = document.getElementById('gameArea');

      let x = Math.random() * (gameArea.clientWidth - div.clientWidth);
      let y = Math.random() * (gameArea.clientHeight - div.clientHeight);

      let dx = (Math.random() - 0.5) * 2;
      let dy = (Math.random() - 0.5) * 2;

      function move() {

        x += dx;
        y += dy;

        if (x < 0 || x + div.clientWidth > gameArea.clientWidth) dx = -dx;
        if (y < 0 || y + div.clientHeight > gameArea.clientHeight) dy = -dy;

        div.style.left = x + "px";
        div.style.top = y + "px";

        requestAnimationFrame(move);
      }

      move();
    }

    function updateScoreboard() {
      document.getElementById('scoreboard').textContent =
        "சரி: " + scoreCorrect +
        " | தவறு: " + scoreWrong +
        " | மீதி: " + englishWordsQueue.length;
    }

    loadCards();
  </script>

</body>

</html>
