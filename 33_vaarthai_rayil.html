<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>வார்த்தை ரயில்</title>
    <style>
        :root {
            --sky: #a1c4fd;
            --grass: #11998e;
            --track: #4b5563;
            --train-red: #e63946;
            --cargo-blue: #3a86ff;
            --gold: #ffb703;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* background: linear-gradient(to bottom, var(--sky), #c2e9fb); */
            background: white;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }


        .home {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }

        #home {
            text-decoration: none;
            background-color: #0000ff;
            color: #ffffff;
            padding: 10px;
            border-radius: 15px;
        }

        .game-container {
            width: 100%;
            max-width: 800px;
            margin: 20px auto;
            text-align: center;
        }

        h1 {
            color: #1d3557;
            margin-bottom: 5px;
            font-size: 2.2rem;
            text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.6);
        }



        .score-board {
            font-size: 1.2rem;
            font-weight: bold;
            color: #1d3557;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.6);
            padding: 5px 15px;
            border-radius: 20px;
            display: inline-block;
        }

        /* --- THE SCENERY & TRAIN TRACK --- */
        .scenery {
            position: relative;
            width: 100%;
            height: 220px;
            background: transparent;
            margin-bottom: 40px;
            overflow: hidden;
        }

        .track {
            position: absolute;
            bottom: 30px;
            width: 100%;
            height: 8px;
            background: var(--track);
        }

        .track::before {
            content: '';
            position: absolute;
            top: 8px;
            width: 100%;
            height: 6px;
            background: repeating-linear-gradient(90deg, #78350f, #78350f 10px, transparent 10px, transparent 25px);
        }

        .ground {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 30px;
            background: var(--grass);
        }

        /* --- THE TRAIN --- */
        .train-wrapper {
            position: absolute;
            bottom: 36px;
            left: -400px;
            display: flex;
            align-items: flex-end;
        }

        .train-wrapper.smooth-move {
            transition: left 0.8s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .train-wrapper.enter {
            left: 10%;
        }

        .train-wrapper.exit {
            left: 110%;
            transition: left 1.5s ease-in !important;
        }

        /* Locomotive Engine */
        .engine {
            width: 90px;
            height: 60px;
            background: var(--train-red);
            border-radius: 10px 25px 5px 5px;
            position: relative;
        }

        .engine::before {
            content: '';
            position: absolute;
            top: 10px;
            right: 15px;
            width: 25px;
            height: 20px;
            background: #e0f2fe;
            border-radius: 4px;
        }

        .engine::after {
            content: '';
            position: absolute;
            top: -15px;
            left: 15px;
            width: 12px;
            height: 15px;
            background: #333;
        }

        /* Train Wheels */
        .wheels {
            position: absolute;
            bottom: -8px;
            width: 100%;
            display: flex;
            justify-content: space-around;
            padding: 0 5px;
            box-sizing: border-box;
        }

        .wheel {
            width: 18px;
            height: 18px;
            background: #111;
            border: 3px dashed #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite paused;
        }

        .moving .wheel {
            animation-play-state: running;
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }

        /* Cargo Carriage */
        .carriage {
            width: 130px;
            height: 50px;
            background: var(--cargo-blue);
            border-radius: 5px;
            margin-right: 15px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.3rem;
            font-weight: bold;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.3);
        }

        .coupler {
            width: 15px;
            height: 6px;
            background: #555;
            align-self: center;
            margin-right: -2px;
        }

        /* --- CARGO SELECTION CARDS --- */
        .instruction {
            font-size: 1.3rem;
            color: #1d3557;
            margin-bottom: 15px;
            font-weight: 500;
        }

        .cargo-options {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            padding: 10px;
        }

        .cargo-box {
            background: var(--gold);
            border: 3px solid #ee9b00;
            color: #001219;
            font-size: 1.5rem;
            font-weight: bold;
            padding: 15px 30px;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 6px 0 #ca6702, 0 10px 20px rgba(0, 0, 0, 0.15);
            transition: all 0.1s ease;
            user-select: none;
            min-width: 120px;
        }

        .cargo-box:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 0 #ca6702, 0 12px 24px rgba(0, 0, 0, 0.2);
        }

        .cargo-box:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #ca6702, 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        /* Feedback popups */
        .feedback {
            font-size: 1.5rem;
            font-weight: bold;
            margin-top: 20px;
            height: 35px;
            transition: 0.3s;
        }

        .correct-text {
            color: #2a9d8f;
        }

        .wrong-text {
            color: #e63946;
        }

        h1 {
            color: blue
        }
    </style>
</head>

<body>
    <div class="home">
        <a id="home" href="index.html"> ◀ முகப்பு</a>
    </div>

    <h1>வார்த்தை ரயில் </h1>

    <div class="game-container">


        <!-- Animation Stage -->
        <div class="scenery">
            <div class="track"></div>

            <div class="train-wrapper" id="train">
                <div class="carriage" id="target-word">Target</div>
                <div class="coupler"></div>
                <div class="engine">
                    <div class="wheels">
                        <div class="wheel"></div>
                        <div class="wheel"></div>
                        <div class="wheel"></div>
                    </div>
                </div>
            </div>

            <div class="ground"></div>
        </div>
        <div class="score-board">மதிப்பெண்: <span id="score">0</span></div>

        <!-- Interaction Station Area -->
        <div class="instruction">சரியான தமிழ் வார்த்தையை தேர்ந்தெடு!</div>
        <div class="cargo-options" id="options-container"></div>

        <div class="feedback" id="feedback-msg"></div>
    </div>

    <script>

        // DATASET
        let wordList = [];

        async function loadCSV() {
            try {
                const response = await fetch('word_list.csv');
                const text = await response.text();
                const lines = text.trim().split('\n');
                
                wordList = lines.slice(1).map(line => {
                    const parts = line.split(',').map(item => item.trim());
                    const [category, tamil, english] = parts;
                    return { category, tamil, english };
                }).filter(item => item.category && item.tamil && item.english);
                
                initRound();
            } catch (error) {
                console.error("Error loading CSV file:", error);
            }
        }

        let currentQuestion = null;
        let score = 0;
        let isTransitioning = false;

        const train = document.getElementById('train');
        const targetWordDisplay = document.getElementById('target-word');
        const optionsContainer = document.getElementById('options-container');
        const feedbackMsg = document.getElementById('feedback-msg');
        const scoreDisplay = document.getElementById('score');

        function initRound() {
            if (wordList.length === 0) return;

            feedbackMsg.innerText = "";
            feedbackMsg.className = "feedback";

            // 1. Pick correct answer
            currentQuestion = wordList[Math.floor(Math.random() * wordList.length)];
            targetWordDisplay.innerText = currentQuestion.english;

            // 2. Clear train layout out of view instantaneously
            train.className = "train-wrapper";
            void train.offsetWidth;

            // 3. Command entrance animation
            train.classList.add('smooth-move', 'moving', 'enter');

            setTimeout(() => {
                train.classList.remove('moving');
            }, 800);

            generateCargoOptions();
        }

        function generateCargoOptions() {
            optionsContainer.innerHTML = "";

            // 1. Filter wrong choices from the SAME category
            let wrongChoicesPool = wordList.filter(item => 
                item.category === currentQuestion.category && item.tamil !== currentQuestion.tamil
            );

            // 2. Fallback: If category has fewer than 3 extra items, pull remaining choices from full pool
            if (wrongChoicesPool.length < 3) {
                let extraChoices = wordList.filter(item => 
                    item.tamil !== currentQuestion.tamil && !wrongChoicesPool.includes(item)
                );
                extraChoices.sort(() => Math.random() - 0.5);
                wrongChoicesPool = wrongChoicesPool.concat(extraChoices.slice(0, 3 - wrongChoicesPool.length));
            }

            // Shuffle the choices pool
            wrongChoicesPool.sort(() => Math.random() - 0.5);

            // Take 3 wrong choices
            let finalChoices = wrongChoicesPool.slice(0, 3).map(item => item.tamil);

            // Add the correct choice
            finalChoices.push(currentQuestion.tamil);

            // Scramble all 4 choices randomly
            finalChoices.sort(() => Math.random() - 0.5);

            // Render buttons
            finalChoices.forEach(tamilWord => {
                const button = document.createElement('div');
                button.className = 'cargo-box';
                button.innerText = tamilWord;
                button.onclick = () => checkAnswer(tamilWord);
                optionsContainer.appendChild(button);
            });
        }

        function checkAnswer(selectedTamil) {
            if (isTransitioning || train.classList.contains('moving') || !train.classList.contains('enter')) return;

            if (selectedTamil === currentQuestion.tamil) {
                score++;
                scoreDisplay.innerText = score;

                feedbackMsg.innerText = "சரியான வார்த்தை!";
                feedbackMsg.classList.add('correct-text');

                triggerTrainDeparture();
            } else {
                feedbackMsg.innerText = "தவறான வார்த்தை! மீண்டும் முயற்சி செய்.";
                feedbackMsg.className = "feedback wrong-text";

                train.style.transform = 'translateX(-10px)';
                setTimeout(() => train.style.transform = 'translateX(0)', 100);
            }
        }

        function triggerTrainDeparture() {
            isTransitioning = true;
            train.classList.add('moving', 'exit');

            setTimeout(() => {
                isTransitioning = false;
                initRound();
            }, 1600);
        }

        window.onload = loadCSV;
    </script>

</body>

</html>
