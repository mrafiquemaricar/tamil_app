<!DOCTYPE html>
<html lang="ta">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>பொதுவான எழுத்தைக் கண்டுபிடி</title>
  <link rel="stylesheet" href="/css/auth.css?v=20260723" />
  <link rel="stylesheet" href="/css/mascot.css?v=20260724" />
  <script src="/js/auth.js?v=20260723"></script>
  <script src="/js/mascot.js?v=20260724"></script>
  <script>
    TamilAuth.initPage();
  </script>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f0f4f8;
      color: #333;
      max-width: 700px;
      margin: auto;
      text-align: center;
    }

    h1 {
      color: #00f;
      text-align: center;
    }

    #home {
      text-decoration: none;
      background-color: #0000ff;
      color: #ffffff;
      padding: 10px;
      border-radius: 15px;
    }

    #categorySelect {
      width: 100%;
      max-width: 400px;
      padding: 10px;
      font-size: 1.1em;
      margin: 20px 0;
      text-align: center;
    }

    #scoreDisplay {
      margin-top: 0.5rem;
      font-size: 1rem;
      color: #495057;
    }

    .wordsBox {
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 10px;
      padding: 20px 10px;
      margin: 1.5rem 0;
      min-height: 60px;
    }

    .line {
      font-size: 2rem;
      line-height: 3.2rem;
      margin-bottom: 0.6rem;
      user-select: none;
      letter-spacing: 1px;
    }

    .letter {
      display: inline-block;
    }

    .blank {
      display: inline-block;
      min-width: 1.3em;
      border-bottom: 4px solid #555;
      text-align: center;
      margin: 0 1px;
    }

    .blank.correct {
      border-color: #28a745;
      color: #155724;
      font-weight: 700;
    }

    .blank.incorrect {
      border-color: #dc3545;
      color: #721c24;
      font-weight: 700;
    }

    #answerRow {
      margin: 1.5rem 0;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    #answerBox {
      font-size: 1.8rem;
      padding: 8px 10px;
      width: 4.5em;
      text-align: center;
      border: 2px solid #555;
      border-radius: 8px;
    }

    #answerBox.correct {
      border-color: #28a745;
      background-color: #d4edda;
      color: #155724;
    }

    #answerBox.incorrect {
      border-color: #dc3545;
      background-color: #f8d7da;
      color: #721c24;
    }

    #message {
      margin-top: 1rem;
      font-weight: 700;
      font-size: 1.3rem;
      min-height: 1.8rem;
    }

    #message.success {
      color: #28a745;
    }

    #message.fail {
      color: #dc3545;
    }

    .buttons {
      margin-top: 1.5rem;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .buttons button {
      background-color: #0000ff;
      border: none;
      color: white;
      font-size: 2.2rem;
      padding: 8px 18px;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .buttons button:hover {
      background-color: #ffa500;
    }

    .hint {
      color: gray;
      font-style: italic;
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <a id="home" href="index.html"> ◀ முகப்பு</a>

  <h1>பொதுவான எழுத்தைக் கண்டுபிடி</h1>
  <div id="scoreDisplay">சரி: 0 / 0</div>

  <select id="categorySelect">
    <option value="">-- தேர்வு செய்யவும் --</option>
  </select>

  <p class="hint">இந்த மூன்று வார்த்தைகளிலும் ஒரே எழுத்து மறைந்துள்ளது. அதைக் கண்டுபிடி!</p>

  <div class="wordsBox" id="wordsBox"></div>

  <div id="answerRow">
    <input type="text" id="answerBox" maxlength="3" placeholder="?" autocomplete="off" />
    <div class="buttons">
      <button id="checkBtn" title="சரி பார்">✔</button>
      <button id="nextBtn" title="அடுத்து">▶</button>
    </div>
  </div>

  <div id="message"></div>

  <script>
    const uyirLetters = ['அ', 'ஆ', 'இ', 'ஈ', 'உ', 'ஊ', 'எ', 'ஏ', 'ஐ', 'ஒ', 'ஓ', 'ஔ'];
    const meiLetters = ['க்', 'ங்', 'ச்', 'ஞ்', 'ட்', 'ண்', 'த்', 'ந்', 'ப்', 'ம்', 'ய்', 'ர்', 'ல்', 'வ்', 'ழ்', 'ள்', 'ற்', 'ன்'];
    const uyirmeiLetters = ['க', 'கா', 'கி', 'கீ', 'கு', 'கூ', 'கெ', 'கே', 'கை', 'கொ', 'கோ', 'கௌ',
      'ங', 'ஙா', 'ஙி', 'ஙீ', 'ஙு', 'ஙூ', 'ஙெ', 'ஙே', 'ஙை', 'ஙொ', 'ஙோ', 'ஙௌ',
      'ச', 'சா', 'சி', 'சீ', 'சு', 'சூ', 'செ', 'சே', 'சை', 'சொ', 'சோ', 'சௌ',
      'ஞ', 'ஞா', 'ஞி', 'ஞீ', 'ஞு', 'ஞூ', 'ஞெ', 'ஞே', 'ஞை', 'ஞொ', 'ஞோ', 'ஞௌ',
      'ட', 'டா', 'டி', 'டீ', 'டு', 'டூ', 'டெ', 'டே', 'டை', 'டொ', 'டோ', 'டௌ',
      'ண', 'ணா', 'ணி', 'ணீ', 'ணு', 'ணூ', 'ணெ', 'ணே', 'ணை', 'ணொ', 'ணோ', 'ணௌ',
      'த', 'தா', 'தி', 'தீ', 'து', 'தூ', 'தெ', 'தே', 'தை', 'தொ', 'தோ', 'தௌ',
      'ந', 'நா', 'நி', 'நீ', 'நு', 'நூ', 'நெ', 'நே', 'நை', 'நொ', 'நோ', 'நௌ',
      'ப', 'பா', 'பி', 'பீ', 'பு', 'பூ', 'பெ', 'பே', 'பை', 'பொ', 'போ', 'பௌ',
      'ம', 'மா', 'மி', 'மீ', 'மு', 'மூ', 'மெ', 'மே', 'மை', 'மொ', 'மோ', 'மௌ',
      'ய', 'யா', 'யி', 'யீ', 'யு', 'யூ', 'யெ', 'யே', 'யை', 'யொ', 'யோ', 'யௌ',
      'ர', 'ரா', 'ரி', 'ரீ', 'ரு', 'ரூ', 'ரெ', 'ரே', 'ரை', 'ரொ', 'ரோ', 'ரௌ',
      'ல', 'லா', 'லி', 'லீ', 'லு', 'லூ', 'லெ', 'லே', 'லை', 'லொ', 'லோ', 'லௌ',
      'வ', 'வா', 'வி', 'வீ', 'வு', 'வூ', 'வெ', 'வே', 'வை', 'வொ', 'வோ', 'வௌ',
      'ழ', 'ழா', 'ழி', 'ழீ', 'ழு', 'ழூ', 'ழெ', 'ழே', 'ழை', 'ழொ', 'ழோ', 'ழௌ',
      'ள', 'ளா', 'ளி', 'ளீ', 'ளு', 'ளூ', 'ளெ', 'ளே', 'ளை', 'ளொ', 'ளோ', 'ளௌ',
      'ற', 'றா', 'றி', 'றீ', 'று', 'றூ', 'றெ', 'றே', 'றை', 'றொ', 'றோ', 'றௌ',
      'ன', 'னா', 'னி', 'னீ', 'னு', 'னூ', 'னெ', 'னே', 'னை', 'னொ', 'னோ', 'னௌ'];
    const aythaLetter = ["ஃ"];
    const kiranthaLetters = ['ஜ்', 'ஜ', 'ஜா', 'ஜி', 'ஜீ', 'ஜு', 'ஜூ', 'ஜெ', 'ஜே', 'ஜை', 'ஜொ', 'ஜோ', 'ஜௌ',
      'ஷ்', 'ஷ', 'ஷா', 'ஷி', 'ஷீ', 'ஷு', 'ஷூ', 'ஷெ', 'ஷே', 'ஷை', 'ஷொ', 'ஷோ', 'ஷௌ',
      'ஸ்', 'ஸ', 'ஸா', 'ஸி', 'ஸீ', 'ஸு', 'ஸூ', 'ஸெ', 'ஸே', 'ஸை', 'ஸொ', 'ஸோ', 'ஸௌ',
      'ஹ்', 'ஹ', 'ஹா', 'ஹி', 'ஹீ', 'ஹு', 'ஹூ', 'ஹெ', 'ஹே', 'ஹை', 'ஹொ', 'ஹோ', 'ஹௌ',
      'க்ஷ்', 'க்ஷ', 'க்ஷா', 'க்ஷி', 'க்ஷீ', 'க்ஷு', 'க்ஷூ', 'க்ஷெ', 'க்ஷே', 'க்ஷை', 'க்ஷொ', 'க்ஷோ', 'க்ஷெள',
      'ஸ்ரீ'];

    const allLetters = uyirLetters.concat(meiLetters, uyirmeiLetters, aythaLetter, kiranthaLetters);

    function splitTamilWord(word) {
      const result = [];
      let i = 0;
      while (i < word.length) {
        let matched = false;
        for (let len = 3; len > 0; len--) {
          if (i + len <= word.length) {
            const part = word.substring(i, i + len);
            if (allLetters.includes(part)) {
              result.push(part);
              i += len;
              matched = true;
              break;
            }
          }
        }
        if (!matched) {
          result.push(word[i]);
          i++;
        }
      }
      return result;
    }

    function parseCSV(text) {
      const rows = [];
      let cur = [];
      let field = '';
      let inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        if (ch === '"') {
          if (inQuotes && text[i + 1] === '"') { field += '"'; i++; }
          else { inQuotes = !inQuotes; }
        } else if (ch === ',' && !inQuotes) {
          cur.push(field); field = '';
        } else if ((ch === '\n' || ch === '\r') && !inQuotes) {
          if (ch === '\r' && text[i + 1] === '\n') i++;
          cur.push(field); field = '';
          if (cur.some(c => (c || '').trim() !== '')) rows.push(cur);
          cur = [];
        } else {
          field += ch;
        }
      }
      if (field !== '' || cur.length > 0) {
        cur.push(field);
        if (cur.some(c => (c || '').trim() !== '')) rows.push(cur);
      }
      return rows;
    }

    const sheetUrl = 'word_list.csv';
    const categorySelect = document.getElementById('categorySelect');
    const wordsBox = document.getElementById('wordsBox');
    const answerBox = document.getElementById('answerBox');
    const checkBtn = document.getElementById('checkBtn');
    const nextBtn = document.getElementById('nextBtn');
    const message = document.getElementById('message');
    const scoreDisplay = document.getElementById('scoreDisplay');

    let dataRows = [];
    let currentWords = [];   // [{tamil, letters}]
    let commonLetter = '';
    let score = 0;
    let total = 0;
    let answered = false;

    function shuffleArray(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function updateScore() {
      scoreDisplay.textContent = `சரி: ${score} / ${total}`;
    }

    fetch(sheetUrl)
      .then(res => res.text())
      .then(text => {
        const rawRows = parseCSV(text);
        if (rawRows.length === 0) return;
        const header = rawRows[0].map(h => (h || '').trim());
        if (header.length > 0) header[0] = header[0].replace(/^\uFEFF/, '');
        let catIndex = header.indexOf('Category');
        let tamilIndex = header.indexOf('Tamil');
        if (catIndex === -1) catIndex = 0;
        if (tamilIndex === -1) tamilIndex = 1;

        for (let r = 1; r < rawRows.length; r++) {
          const row = rawRows[r];
          const cat = (row[catIndex] || '').trim();
          const tam = (row[tamilIndex] || '').trim();
          if (cat && tam) dataRows.push({ category: cat, tamil: tam });
        }

        const categories = [...new Set(dataRows.map(r => r.category))].sort();
        categories.forEach(cat => {
          const opt = document.createElement('option');
          opt.value = cat;
          opt.textContent = cat;
          categorySelect.appendChild(opt);
        });
      })
      .catch(err => {
        alert("CSV படிப்பதில் பிழை: " + err);
        console.error(err);
      });

    categorySelect.addEventListener('change', () => {
      score = 0; total = 0;
      updateScore();
      generateSet();
    });

    function findTripleWithCommonLetter(pool) {
      if (pool.length < 3) return null;
      const withLetters = pool.map(w => ({ tamil: w.tamil, letters: splitTamilWord(w.tamil) }));
      const maxAttempts = 400;
      for (let attempt = 0; attempt < maxAttempts; attempt++) {
        const shuffled = shuffleArray(withLetters.slice());
        const three = shuffled.slice(0, 3);
        const sets = three.map(w => new Set(w.letters));
        const common = [...sets[0]].filter(l => sets[1].has(l) && sets[2].has(l) && l.trim() !== '');
        if (common.length > 0) {
          const letter = common[Math.floor(Math.random() * common.length)];
          return { words: three, letter };
        }
      }
      return null;
    }

    function generateSet() {
      const category = categorySelect.value;
      message.textContent = '';
      message.className = '';
      answerBox.value = '';
      answerBox.classList.remove('correct', 'incorrect');
      answered = false;

      if (!category) {
        wordsBox.innerHTML = '<p>⚡ முதலில் ஒரு பிரிவைத் தேர்வு செய்யவும்</p>';
        currentWords = [];
        commonLetter = '';
        return;
      }

      let pool = dataRows.filter(r => r.category === category);
      let result = findTripleWithCommonLetter(pool);

      // Fallback: search across all categories if this one has no match
      if (!result) {
        result = findTripleWithCommonLetter(dataRows);
      }

      if (!result) {
        wordsBox.innerHTML = '<p>பொருத்தமான வார்த்தைகள் கிடைக்கவில்லை. மீண்டும் முயற்சிக்கவும்.</p>';
        currentWords = [];
        commonLetter = '';
        return;
      }

      currentWords = result.words;
      commonLetter = result.letter;
      renderWords();
      answerBox.focus();
    }

    function renderWords() {
      wordsBox.innerHTML = '';
      currentWords.forEach(w => {
        const lineDiv = document.createElement('div');
        lineDiv.className = 'line';
        w.letters.forEach(letter => {
          if (letter === commonLetter) {
            const span = document.createElement('span');
            span.className = 'blank';
            span.textContent = '\u00A0\u00A0';
            span.dataset.role = 'blank';
            lineDiv.appendChild(span);
          } else {
            const span = document.createElement('span');
            span.className = 'letter';
            span.textContent = letter;
            lineDiv.appendChild(span);
          }
        });
        wordsBox.appendChild(lineDiv);
      });
    }

    function revealBlanks(isCorrect) {
      document.querySelectorAll('.blank').forEach(span => {
        span.textContent = commonLetter;
        span.classList.add(isCorrect ? 'correct' : 'incorrect');
      });
    }

    function checkAnswer() {
      if (!commonLetter || answered) return;
      const userAnswer = answerBox.value.trim();
      if (!userAnswer) return;

      answered = true;
      total++;
      const isCorrect = userAnswer === commonLetter;
      if (isCorrect) score++;

      answerBox.classList.add(isCorrect ? 'correct' : 'incorrect');
      revealBlanks(isCorrect);

      message.textContent = isCorrect ? 'சரி ✅' : ('தவறு ❌  சரியான எழுத்து: ' + commonLetter);
      message.className = isCorrect ? 'success' : 'fail';

      updateScore();
    }

    checkBtn.addEventListener('click', checkAnswer);
    nextBtn.addEventListener('click', generateSet);
    answerBox.addEventListener('keydown', e => {
      if (e.key === 'Enter') checkAnswer();
    });
  </script>
</body>

</html>
