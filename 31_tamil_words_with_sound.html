    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 10px;
            margin: 0;
            background: #fdfdfd;
        }

        .home {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }

        #home {
            text-decoration: none;
            background-color: #0000ff;
            color: #ffffff;
            padding: 10px;
            border-radius: 15px;
        }

        h1 {
            color: #00f;
            text-align: center;
        }

        h2 {
            color: #4b0082;
        }

        .section {
            border: 2px solid #ccc;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 20px;
        }

        .voice-toggle {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
        }

        .uyir-buttons,
        .mei-buttons,
        .uyirmei-buttons,
        #aythaButtons {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
        }

        /* --- 3D Flip Card Container Styling --- */
        .card-container {
            perspective: 1000px;
            height: 140px;
            background: transparent;
            border: none;
            padding: 0;
            cursor: pointer;
        }

        .card {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .front, .back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 12px;
            box-sizing: border-box;
            padding: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .back {
            transform: rotateY(180deg);
            background-color: #f9f9f9 !important;
            border: 2px dashed #bbb;
        }

        .letter-main {
            font-size: 42px;
            font-weight: bold;
        }

        .letter-word, .translation-word {
            font-size: 13px;
            line-height: 1.4;
            margin-top: 2px;
        }

        .translation-word {
            color: #555;
            font-style: italic;
        }

        .highlight {
            background: yellow;
            padding: 2px;
            border-radius: 3px;
            color: #000;
        }

        /* --- Theme Color Maps --- */
        .uyir-button .front { background: #ffdddd; }
        .mei-button .front { background: #ddeeff; }
        .uyirmei-button .front { background: #ddffdd; }
        .aytha-button .front { background: #fff0db; }

        .disabled-btn {
            opacity: 0.4;
            cursor: not-allowed;
            pointer-events: none;
        }
    </style>
</head>

            'னீ': [{ tamil: 'தேனீ', english: 'Honeybee' }, { tamil: 'நன்னீர்', english: 'Fresh water' }],
            'னு': [{ tamil: 'மனு', english: 'Petition' }, { tamil: 'அவனுடன்', english: 'With him' }],
            'னூ': [{ tamil: 'முன்னூறு', english: 'Three Hundred' }, { tamil: 'நன்னூல்', english: 'Grammar book' }],
            'னெ': [{ tamil: 'நன்னெறி', english: 'Good path' }],
            'னே': [{ tamil: 'முன்னே', english: 'In front' }, { tamil: 'பின்னே', english: 'Behind' }, { tamil: 'என்னே', english: 'What a wonder' }],
            'னை': [{ tamil: 'அவனை', english: 'Him' }, { tamil: 'என்னை', english: 'Me' }, { tamil: 'யானை', english: 'Elephant' }],
            'னொ': [{ tamil: 'பின்னொன்று', english: 'Another one' }, { tamil: 'பொன்னொளி', english: 'Golden light' }],
            'னோ': [{ tamil: 'பின்னோடு', english: 'Behind' }, { tamil: 'என்னோடு', english: 'With me' }]
        };

        /* ================= GLOBAL CONTROL ================= */
        let speechSession = 0;
        let speechTimer = null;
        let currentUtterance = null;
        let activeCard = null; 

        const voiceToggle = document.getElementById("voiceToggle");

        /* ================= STOP ENGINE ================= */
        function stopSpeech() {
            speechSession++;
            speechSynthesis.cancel();

            if (speechTimer) {
                clearTimeout(speechTimer);
                speechTimer = null;
            }

            if (currentUtterance) {
                currentUtterance.onend = null;
                currentUtterance = null;
            }

            document.querySelectorAll(".highlight").forEach(el => {
                el.classList.remove("highlight");
            });

            if (activeCard) {
                activeCard.classList.remove("flipped");
                activeCard = null;
            }
        }

        /* ================= PLAY ENGINE ================= */
        function playAudio(letter, cardElement) {
            stopSpeech();

            activeCard = cardElement;
            activeCard.classList.add("flipped");

            const session = speechSession;
            const wordPairs = wordMap[letter] || [];

            const frontTamilSpans = activeCard.querySelectorAll(".front .letter-word span");
            const backTamilSpans = activeCard.querySelectorAll(".back .letter-word-tamil span");
            const backEnglishSpans = activeCard.querySelectorAll(".back .translation-word span");

            let index = 0;

            function speakNext() {
                if (session !== speechSession) return;

                if (index >= wordPairs.length) {
                    frontTamilSpans.forEach(s => s.classList.remove("highlight"));
                    backTamilSpans.forEach(s => s.classList.remove("highlight"));
                    backEnglishSpans.forEach(s => s.classList.remove("highlight"));
                    
                    if (activeCard === cardElement) {
                        cardElement.classList.remove("flipped");
                        activeCard = null;
                    }
                    return;
                }

                frontTamilSpans.forEach(s => s.classList.remove("highlight"));
                backTamilSpans.forEach(s => s.classList.remove("highlight"));
                backEnglishSpans.forEach(s => s.classList.remove("highlight"));

                if (frontTamilSpans[index]) frontTamilSpans[index].classList.add("highlight");
                if (backTamilSpans[index]) backTamilSpans[index].classList.add("highlight");
                if (backEnglishSpans[index]) backEnglishSpans[index].classList.add("highlight");

                const utter = new SpeechSynthesisUtterance(wordPairs[index].tamil);
                currentUtterance = utter;

                utter.lang = "ta-IN";
                utter.rate = 0.85;

                utter.onend = () => {
                    if (session !== speechSession) return;
                    index++;
                    speechTimer = setTimeout(speakNext, 400); 
                };

                speechSynthesis.speak(utter);
            }

            if (voiceToggle.checked && wordPairs.length > 0) {
                speakNext();
            } else {
                speechTimer = setTimeout(() => {
                    if (session === speechSession) cardElement.classList.remove("flipped");
                }, 2500);
            }
        }

        /* ================= BUTTON BUILDER ================= */
        function createButtons(containerId, letters, className) {
            const container = document.getElementById(containerId);
            letters.forEach(l => {
                const containerBtn = document.createElement('button');
                containerBtn.className = `card-container ${className}`;

                const isDisabled = l.startsWith('-');
                const display = isDisabled ? l.substring(1) : l;
                
                const wordPairs = wordMap[display] || [];

                if (isDisabled) {
                    containerBtn.classList.add('disabled-btn');
                    containerBtn.disabled = true;
                }

                const cardInner = document.createElement('div');
                cardInner.className = 'card';

                /* ── FRONT FACE ── */
                const frontFace = document.createElement('div');
                frontFace.className = 'front';

                const letterSpanFront = document.createElement('span');
                letterSpanFront.className = 'letter-main';
                letterSpanFront.textContent = display;

                const wordSpanFront = document.createElement('span');
                wordSpanFront.className = 'letter-word';
                wordSpanFront.innerHTML = wordPairs.map(p => `<span>${p.tamil}</span>`).join('<br>');

                frontFace.appendChild(letterSpanFront);
                frontFace.appendChild(wordSpanFront);

                /* ── BACK FACE ── */
                const backFace = document.createElement('div');
                backFace.className = 'back';

                const wordSpanBackTamil = document.createElement('span');
                wordSpanBackTamil.className = 'letter-word-tamil';
                wordSpanBackTamil.style.fontWeight = "bold";
                wordSpanBackTamil.style.fontSize = "13px";
                wordSpanBackTamil.innerHTML = wordPairs.map(p => `<span>${p.tamil}</span>`).join('<br>');

                const divider = document.createElement('hr');
                divider.style.width = "85%";
                divider.style.margin = "6px 0";
                divider.style.border = "0.5px solid #ccc";

                const wordSpanBackEnglish = document.createElement('span');
                wordSpanBackEnglish.className = 'translation-word';
                wordSpanBackEnglish.innerHTML = wordPairs.map(p => `<span>${p.english}</span>`).join('<br>');

                backFace.appendChild(wordSpanBackTamil);
                backFace.appendChild(divider);
                backFace.appendChild(wordSpanBackEnglish);

                cardInner.appendChild(frontFace);
                cardInner.appendChild(backFace);
                containerBtn.appendChild(cardInner);

                if (!isDisabled) {
                    containerBtn.onclick = (e) => {
                        e.stopPropagation();
                        playAudio(display, cardInner);
                    };
                }

                container.appendChild(containerBtn);
            });
        }

        /* ================= INIT ================= */
        createButtons("uyirButtons", uyirLetters, "uyir-button");
        createButtons("meiButtons", meiLetters, "mei-button");
        createButtons("uyirmeiButtons", uyirmeiLetters, "uyirmei-button");
        createButtons('aythaButtons', aythaLetter, 'aytha-button');

        document.addEventListener("click", () => {
            stopSpeech();
        });
    </script>
</body>
</html>
